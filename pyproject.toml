[project]
name = "tenderscout"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "username", email = "filipioan_29@yahoo.ro" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "langchain-core>=1.7.0",
    "langchain-openai>=1.7.2",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
]


[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
